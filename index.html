<style>
/* Layout: one stage; a single dot gives birth to every shape of the mark */
:root{--bg:#F4F4F2;--ink:#161615;--btn:#ffffff;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
svg{width:min(824px,100%);height:auto;overflow:visible}
button{font:inherit;font-size:14px;padding:10px 18px;border:1px solid var(--ink);background:var(--btn);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid #013BF6;outline-offset:2px}

/* hover: solid mark morphs into its outline version */
svg{cursor:default}
.shape{stroke-width:2;stroke-opacity:0;fill-opacity:1;transition:fill-opacity .55s cubic-bezier(.4,0,.2,1),stroke-opacity .35s ease}
svg.outlined .shape{fill-opacity:0;stroke-opacity:1}
#black{transition-delay:0s}#dot{transition-delay:.06s}#blue{transition-delay:.12s}#red{transition-delay:.18s}#t1{transition-delay:.24s}#t2{transition-delay:.3s}
svg:not(.outlined) .shape{transition-delay:0s}

.txf{transition:fill-opacity .45s cubic-bezier(.4,0,.2,1) .2s}
svg.outlined .txf{fill-opacity:0}
#txo{opacity:0;transition:opacity .45s cubic-bezier(.4,0,.2,1) .25s;pointer-events:none}
svg.outlined #txo{opacity:1}

html.playing,html.playing body{touch-action:manipulation}
body{padding-bottom:72px!important}
.stage{position:relative;width:min(824px,100%)}
.stage svg{width:100%}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
#play{transform:scale(0);transition:transform .45s cubic-bezier(.3,1.7,.4,1);pointer-events:none}
#dot.ready{cursor:pointer}
svg.canplay #play{transform:scale(1)}
svg.canplay .shape{fill-opacity:1;stroke-opacity:0}
svg.canplay .txf{fill-opacity:1}
svg.canplay #txo{opacity:0}
svg.nohover .shape{fill-opacity:1!important;stroke-opacity:0!important}
svg.nohover #txo{opacity:0!important}
svg.nohover #play{transform:scale(0)}
[hidden]{display:none!important}
.stage,.stage *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html.playing,html.playing body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#game{touch-action:none}
#jump text{font:700 95px "Inter Tight","Helvetica Neue",Arial,sans-serif;letter-spacing:-3px;fill:#161615;pointer-events:none}
.foot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px max(24px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));border-top:1px solid #161615;background:#F4F4F2;font:600 14px "Inter Tight","Helvetica Neue",Arial,sans-serif;color:#161615;letter-spacing:-.01em}
.foot-r{display:flex;align-items:center;gap:20px}
#snd{background:none;border:0;padding:4px;color:#161615;cursor:pointer;display:inline-flex}
#snd svg{width:14px!important;height:14px!important}
#snd .x{display:none}#snd[aria-pressed=false] .x{display:inline}#snd[aria-pressed=false] .w{display:none}
#snd:focus-visible{outline:2px solid #013BF6;outline-offset:3px}
.foot a{color:#161615;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
@media (hover:hover){.foot a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}}
.foot a:focus-visible{outline:2px solid #013BF6;outline-offset:3px}
svg.nohover #jump text{opacity:0!important}

/* ---- Game Over: OOPS. THAT WAS INTERESTING. ---- */
#over{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);min-height:100%;display:flex;align-items:center;background:#F4F4F2;font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif;color:#161615}
.go{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px 40px;padding:8px 2px}
.go-head{min-width:0}
.go h2{margin:0;font-weight:800;font-size:clamp(64px,15vw,132px);line-height:.82;letter-spacing:-.055em;margin-left:-.04em}
.go h2 .pt{display:inline-block;width:.17em;height:.17em;border-radius:50%;background:#F8A829;margin-left:.05em;visibility:hidden;transform-origin:50% 100%}
.go h2 .pt.on{visibility:visible}
.go h2 .pt.alive{animation:ptIdle 3.4s ease-in-out infinite}
@keyframes ptIdle{0%,78%,100%{transform:none}84%{transform:translateY(-3px) scale(.97,1.03)}90%{transform:translateY(0) scale(1.04,.96)}95%{transform:scale(.99,1.01)}}
#bx{position:fixed;left:0;top:0;border-radius:50%;background:#F8A829;z-index:5;pointer-events:none;will-change:transform}
@media (prefers-reduced-motion:reduce){.go h2 .pt.alive{animation:none}}
.go-sub span{opacity:.32}.go-sub span.now{opacity:1}
.go-note{margin:0;font-weight:700;font-size:13px;letter-spacing:.1em}
.go-sub{margin:14px 0 0 4px;font-weight:600;font-size:12px;letter-spacing:.16em}
.go-side{display:flex;flex-direction:column;gap:18px;border-left:1px solid #161615;padding-left:24px;padding-bottom:4px}
.go-stats{display:flex;gap:24px;margin:0;flex-wrap:wrap}
.go-stats div{display:flex;flex-direction:column;gap:2px}
.go-stats dt{font-size:10px;font-weight:600;letter-spacing:.16em;opacity:.55}
.go-stats dd{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.go-act{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.go-act button{font:700 13px "Inter Tight","Helvetica Neue",Arial,sans-serif;letter-spacing:.08em;cursor:pointer;color:#161615;background:none;border:0;padding:12px 0}
.go-act #retry{background:#161615;color:#F4F4F2;padding:12px 16px;display:inline-flex;align-items:center;gap:8px}
.go-act #back{border-bottom:1px solid currentColor;padding:2px 0}
.go-act button:focus-visible{outline:2px solid #013BF6;outline-offset:3px}
@media (hover:hover){.go-act #retry:hover svg{transform:translate(2px,-2px)}.go-act #back:hover{opacity:.6}}
.go-act #retry svg{transition:transform .2s}
.go-act svg,.foot svg{width:11px!important;height:11px!important;flex:none}
.go-act button{white-space:nowrap}
.go [data-s]{opacity:0;transform:translateY(10px);transition:opacity .22s ease,transform .26s cubic-bezier(.2,.9,.2,1)}
#over [data-s="1"]{transform:none!important}
#over.s1 [data-s="1"],#over.s2 [data-s="2"],#over.s3 [data-s="3"]{opacity:1;transform:none}
@media (max-width:560px){.go{grid-template-columns:1fr;gap:18px}.go-side{border-left:0;border-top:1px solid #161615;padding:16px 0 0}}
@media (prefers-reduced-motion:reduce){.go [data-s]{transform:none;transition:opacity .15s}}
</style>

  for(const o of gs.obs){if(o.clear){const k=Math.min(1,(performance.now()-o.clear)/(RM.matches?150:450)),e=E.io(k),h=o.h*(1-e);if(h>.5){x.globalAlpha=1-e*.6;x.fillStyle=o.c;x.fillRect(o.x,G-h,o.w,h);x.globalAlpha=1}continue}if(out){x.strokeStyle=o.c;x.lineWidth=2;x.strokeRect(o.x+1,G-o.h+1,o.w-2,o.h-2)}else{x.fillStyle=o.c;x.fillRect(o.x,G-o.h,o.w,o.h)}}
  gs.sq*=.82;const rx=BR*(1+gs.sq),ry=BR*(1-gs.sq);
  if(gs.trace&&gs.mode==='play'){const k=(performance.now()-gs.trace)/1100;
    if(k>=1)gs.trace=null;else{const a=1-E.io(k);x.save();x.globalAlpha=.55*a;x.strokeStyle=COL.ink;x.lineWidth=1;x.beginPath();
      const r=BR+7+3*E.io(k),st=-Math.PI/2+k*2.2;x.arc(PX,G-BR+gs.y,r,st,st+Math.PI*1.35);x.stroke();x.restore()}}
  if(dying)drawBoing(performance.now());else if(!out){x.beginPath();x.ellipse(PX,G-ry+gs.y,rx,ry,0,0,Math.PI*2);x.fillStyle=COL.y;x.fill()}
  const hudA=gs.msg&&!out?.2:1;x.globalAlpha=hudA;x.fillStyle=COL.ink;x.textAlign='right';x.font='700 15px system-ui,sans-serif';
  x.fillText(Math.floor(gs.score)+'',W-20,30);x.font='500 11px system-ui,sans-serif';x.globalAlpha=.6;
  x.globalAlpha=.6*hudA;x.fillText('NIVEL '+gs.lv+'   RÉCORD '+hi,W-20,48);x.globalAlpha=1;x.textAlign='center';
  if(!out&&!dying)drawMsg(performance.now());
}
newGame(false);
let gAcc=0,gLast=performance.now();const STEP=1000/60;
(function gloop(now){now=now||performance.now();
  if(mode==='game'){gAcc+=Math.min(250,now-gLast);let n=0;while(gAcc>=STEP&&n<8){gstep();gAcc-=STEP;n++}if(n===8)gAcc=0;gdraw()}else gAcc=0;
  gLast=now;requestAnimationFrame(gloop)})();

</script>
